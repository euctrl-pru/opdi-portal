project:
  type: website
  # Output lands inside the portal's own _site, which this repo tracks and
  # deploys. Papers are a separate Quarto *project* -- so a draft that fails to
  # render can never break the site build -- but they are not a separate
  # *site*, and content/resources.qmd links straight into them.
  output-dir: ../_site/papers

website:
  title: "OPDI Papers"
  navbar:
    left:
      - href: index.qmd
        text: Papers
      - href: https://www.eurocontrol.int/opdi
        text: OPDI

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true
    df-print: kable
  # A paper is also a thing people email and print, so it renders to PDF too.
  # Code is echoed in neither format -- see `execute` below -- so code-fold has
  # no PDF equivalent to lose.
  pdf:
    # xelatex, not Quarto's default lualatex: on this Debian texlive the
    # luaotfload font cache cannot be built (no luaotfload-tool binary), so
    # lualatex cannot load the Latin Modern OpenType faces. xelatex resolves
    # them through fontconfig and needs no cache.
    pdf-engine: xelatex
    documentclass: scrartcl
    papersize: a4
    geometry:
      - margin=25mm
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    # Not "H": pinning the figure exactly where it appears in the source left
    # half a page blank ahead of it. "!ht" keeps it near its discussion while
    # letting LaTeX close the gap.
    fig-pos: "!ht"

execute:
  echo: false
  warning: false
  # Every figure reads a committed CSV cache. Rendering must never need S3
  # credentials, a Spark cluster or a database -- refresh the cache with
  #   python benchmarks/export_results.py     (in the opdi repo)
  freeze: auto
