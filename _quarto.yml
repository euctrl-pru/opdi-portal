project:
  type: website
bibliography: bibliography.bib
csl: media/ieee-with-url.csl

execute:
  echo: false
  warning: false


filters:
  - acronyms

acronyms:
  loa_title: "List of Acronyms"
  include_unused: false
  insert_loa: "end"
  insert_links: false
  id_prefix: "acronyms_"
  sorting: "alphabetical"
  non_existing: "key"
  style: "long-short"
  fromfile:
    - media/acronyms.yml


website:
  title: "OPDI"
  # TODO: add GA4 measurement ID when in production (UA property deprecated)
  # google-analytics: "G-XXXXXXXXXX"

  sidebar:
    contents:
      - href: index.qmd
        text: Home
      - data.qmd
      - concepts.qmd
      - methodology.qmd
      - roadmap.qmd
      - href: data-preview.qmd
        text: Data Preview
      - about.qmd

  navbar:
  # Note: You need to install: ```quarto install extension mcanouil/quarto-iconify```
  # For the icons to work.
    background: dark
    search: true
    collapse-below: xl
    title: 'Open Performance Data Initiative (OPDI)'
    logo: "media/EUROCONTROL-logo-standard-rgb.png"
    right:
      - text: "Home"
        href: https://ansperformance.eu/
      - text: "Performance areas"
        menu:
          - text: "{{< iconify fa6-solid table-cells-large >}}&nbsp;Balanced scorecard"
            href: "https://www.eurocontrol.int/Economics/BalancedScorecard.html"
          - text: "{{< iconify fa6-solid plane-departure >}}&nbsp;Traffic"
            href: https://ansperformance.eu/traffic/
          - text: "Daily traffic dashboard"
            href: "https://www.eurocontrol.int/Economics/DailyTrafficVariation-States.html"
          - text: "Service units"
            href: "https://www.eurocontrol.int/ServiceUnits/Dashboard/EnRouteMainDashboard.html"
          - text: "Traffic forecast"
            href: https://ansperformance.eu/traffic/statfor/
          - text: "{{< iconify fa6-solid calendar >}}&nbsp;Punctuality"
            href: https://ansperformance.eu/traffic/punctuality/
          - text: "Daily punctuality dashboard"
            href: "https://www.eurocontrol.int/Economics/DailyPunctuality-States.html"
          - text: "Network punctuality"
