project:
  type: website
  render:
    - index.qmd
    - content/
    - "!archive/"
    # The community page is hidden: it is not rendered, so it is not on the
    # site and not in its search. Exclusions must come after the pages to
    # render. To show the page again, remove this line as well (see the note
    # in the sidebar below and tools/README.md).
    - "!content/community.qmd"
    # papers/ is its own Quarto project (papers/_quarto.yml); it is linked from
    # content/resources.qmd but must not be pulled into the site build.
    - "!papers/"
  resources:
    - assets/
    - "!assets/bib/"
    - "!assets/csl/"
bibliography: assets/bib/bibliography.bib
csl: assets/csl/ieee-with-url.csl

execute:
  echo: false
  warning: false


filters:
  - acronyms

acronyms:
  loa_title: "List of Acronyms"
  include_unused: false
  insert_loa: "end"
  insert_links: false
  id_prefix: "acronyms_"
  sorting: "alphabetical"
  non_existing: "key"
  style: "long-short"
  fromfile:
    - assets/acronyms.yml


