format:
  html:
    theme: cosmo
    toc: true
    include-in-header:
      text: |
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    css:
      - templates/css/custom.css
      - styles.css
    include-after-body: templates/footer.html
